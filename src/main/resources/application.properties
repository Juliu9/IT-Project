# Settings: docs/configuration.md | Job commands: docs/jobs/README.md

# === 1. Shared backend selection ===
audiobook.database=${AUDIOBOOK_DATABASE:qdrant}

# === 2. Shared AI and embeddings ===
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.retry.max-attempts=3

# Keep catalogue, query and user vectors compatible; changes require regeneration.
embedding.dimensions=${EMBEDDING_DIMENSIONS:1536}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.embedding.options.dimensions=${embedding.dimensions}

# === 3. Recommendation server ===

# Application and HTTP
spring.application.name=RecommenderAgent
server.port=8080
spring.threads.virtual.enabled=true

# Sessions (maintenance jobs do not use Redis)
session.store=${SESSION_STORE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}

# Chat roles: blank inherits spring.ai.openai.chat.model.
ai.input-parser.model=${INPUT_PARSER_CHAT_MODEL:}
ai.response-generator.model=${RESPONSE_GENERATOR_CHAT_MODEL:}

# Ranking weights are relative contributions, not percentages.
ranking.scoring.retrieval-relevance-weight=${RANKING_SCORING_RETRIEVAL_RELEVANCE_WEIGHT:1.0}
ranking.scoring.user-preference-weight=${RANKING_SCORING_USER_PREFERENCE_WEIGHT:1.0}
ranking.scoring.universal-rules-weight=${RANKING_SCORING_UNIVERSAL_RULES_WEIGHT:0.5}
ranking.scoring.user-preference.favourites-weight=${RANKING_SCORING_FAVOURITES_WEIGHT:0.6}
ranking.scoring.user-preference.history-weight=${RANKING_SCORING_HISTORY_WEIGHT:0.4}
ranking.scoring.universal-rules.recency-weight=${RANKING_SCORING_UNIVERSAL_RECENCY_WEIGHT:0.7}
ranking.scoring.universal-rules.duration-plausibility-weight=${RANKING_SCORING_UNIVERSAL_DURATION_PLAUSIBILITY_WEIGHT:0.3}

# === 4. Shared database connections ===

# Qdrant
qdrant.url=${QDRANT_URL:http://localhost:6333}
qdrant.grpc-port=${QDRANT_GRPC_PORT:6334}
qdrant.api-key=${QDRANT_API_KEY:}
qdrant.collection=${QDRANT_COLLECTION:audiobooks_hybrid}
qdrant.embedding-dimension=${embedding.dimensions}
qdrant.timeout=${QDRANT_TIMEOUT:15s}
qdrant.user-preference-collection=${QDRANT_USER_PREFERENCE_COLLECTION:user}

# Solr
solr.url=${SOLR_URL:http://localhost:8983/solr}
solr.collection=${SOLR_COLLECTION:combinedbooks}
solr.username=${SOLR_USERNAME:}
solr.password=${SOLR_PASSWORD:}
solr.vector-field=${SOLR_VECTOR_FIELD:embedding}
solr.embedding-dimension=${embedding.dimensions}
solr.user-preference-collection=${SOLR_USER_PREFERENCE_COLLECTION:user}

# === 5. Maintenance jobs ===
# Dedicated launchers only. Supply enable flags, modes and inputs per run.

# 5.1 Catalogue embeddings
audiobook.embedding-index.enabled=${AUDIOBOOK_EMBEDDING_INDEX_ENABLED:false}
audiobook.embedding-index.page-size=${AUDIOBOOK_EMBEDDING_INDEX_PAGE_SIZE:100}
# Zero scans all records; this limit does not limit snapshot export.
audiobook.embedding-index.maximum-records=${AUDIOBOOK_EMBEDDING_INDEX_MAXIMUM_RECORDS:0}

# 5.2 Book-vector snapshots (shared by embedding generation and user import)
book.vector-snapshot.directory=${BOOK_VECTOR_SNAPSHOT_DIRECTORY:./data/book-vector-snapshot}
book.vector-snapshot.page-size=${BOOK_VECTOR_SNAPSHOT_PAGE_SIZE:500}

# 5.3 Short descriptions
audiobook.short-description.batch.mode=${AUDIOBOOK_SHORT_DESCRIPTION_BATCH_MODE:disabled}
audiobook.short-description.batch.provider=${AUDIOBOOK_SHORT_DESCRIPTION_BATCH_PROVIDER:openai}
audiobook.short-description.batch.id=${AUDIOBOOK_SHORT_DESCRIPTION_BATCH_ID:}
# Retain pending manifests between submit/import/recover.
audiobook.short-description.batch.output-directory=${AUDIOBOOK_SHORT_DESCRIPTION_BATCH_OUTPUT_DIRECTORY:./data/short-descriptions}
audiobook.short-description.batch.maximum-records=${AUDIOBOOK_SHORT_DESCRIPTION_BATCH_MAXIMUM_RECORDS:100000}
audiobook.short-description.batch.openai.base-url=${OPENAI_BATCH_BASE_URL:https://api.openai.com/v1}
audiobook.short-description.batch.openai.model=${OPENAI_BATCH_MODEL:gpt-4o-mini}

# 5.4 User-preference import
# Explicit write mode replaces or clears imported users' taste vectors.
user.preferences.import-on-startup=${USER_PREFERENCES_IMPORT_ON_STARTUP:false}
user.preferences.import.mode=${USER_PREFERENCES_IMPORT_MODE:dry-run}
user.preferences.favourites-csv-path=${USER_PREFERENCES_FAVOURITES_CSV_PATH:}
user.preferences.history-csv-path=${USER_PREFERENCES_HISTORY_CSV_PATH:}
# Group/user book-ID cap; does not bound the full snapshot cache.
user.preferences.import.max-book-ids-per-group=${USER_PREFERENCES_IMPORT_MAX_BOOK_IDS_PER_GROUP:100000}
user.preferences.import.max-records-in-memory=${USER_PREFERENCES_IMPORT_MAX_RECORDS_IN_MEMORY:100000}
user.preferences.import.work-directory=${USER_PREFERENCES_IMPORT_WORK_DIRECTORY:./data/user-import-work}

# 5.5 Solr-to-Qdrant migration
audiobook.qdrant.migration.enabled=${QDRANT_MIGRATION_ENABLED:false}
audiobook.qdrant.migration.batch-size=${QDRANT_MIGRATION_BATCH_SIZE:100}
# Zero scans all source records, including already-present books.
audiobook.qdrant.migration.max-records=${QDRANT_MIGRATION_MAX_RECORDS:0}
