services:
  history:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: read_history
      POSTGRES_USER: read_history
      POSTGRES_PASSWORD: ${READ_HISTORY_PASSWORD:?Set READ_HISTORY_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - read_history_data:/var/lib/postgresql/data

volumes:
  read_history_data:
